[package]
name = "idwc"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A Rust-subset to standalone C17 transpiler with strict and readable modes"
readme = "README.md"
documentation = "https://docs.rs/idwc"
repository = "https://github.com/DanielQu9/idwc"
keywords = ["transpiler", "compiler", "rust", "c", "c17"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }

[lints.clippy]
# IdwC examples intentionally use the sequential placeholders accepted by the
# transpiler; captured Rust format arguments remain outside the strict subset.
uninlined_format_args = "allow"
