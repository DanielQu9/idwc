[package]
name = "idwc"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A strict Rust-subset to standalone C17 transpiler"
readme = "README.md"
documentation = "https://docs.rs/idwc"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }
